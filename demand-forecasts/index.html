      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

nd model\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--muted-foreground); padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/results/\"\u003EResults\u003C/a\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003EDemand forecasts\u003C/strong\u003E\u003C/span\u003E\u003C/div\u003E\n\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 20 October 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6b0bfa2dbac96e5c76c7d14299ed3bb5", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"demand-forecasts\"\u003EDemand forecasts\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EGas demand for the next two weeks, per LDZ, from the ECMWF ensemble.\u003C/em\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEach day's 00z ensemble gives 50 equally likely versions of the next 15 days' weather. Each goes\nthrough the \u003Ca href=\"/ldz-demand/demand-model/\"\u003Edemand model\u003C/a\u003E, giving 50 demand paths per LDZ for lead days 0\u201313; GB is\ntheir sum, member by member.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe intervals include the model's own error, not just the weather's.\u003C/strong\u003E On its own, the spread of\nthe 50 members is far too narrow at short leads: it says how uncertain the weather is, not how far\nthe model can be off when the weather is known. So each member is combined with the model's\nout-of-sample errors from historical days at the same time of year (all LDZs from the same day, so\ntheir errors stay correlated). The dotted lines show the weather-only spread for comparison. The\nerrors widen the interval but don't move it \u2014 no bias correction yet.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDemand is total \u2212 DM (the model's target), GWh/day. Actual demand appears as it is published:\nprovisional (D+1) as open circles, closed out (D+6) as filled.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "db3eb282f1fe455f4354f15cb489e8f3", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 2rem'\u003E\u003Cmarimo-ui-element object-id='bkHC-0' random-id='fcab9188-c83f-0d60-948a-b13cbee60c04'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;Fri 23 Oct 2026\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eRun (00z)\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;Fri 23 Oct 2026\u0026quot;,\u0026quot;Thu 22 Oct 2026\u0026quot;,\u0026quot;Wed 21 Oct 2026\u0026quot;,\u0026quot;Tue 20 Oct 2026\u0026quot;,\u0026quot;Mon 19 Oct 2026\u0026quot;,\u0026quot;Sun 18 Oct 2026\u0026quot;,\u0026quot;Sat 17 Oct 2026\u0026quot;,\u0026quot;Fri 16 Oct 2026\u0026quot;,\u0026quot;Thu 15 Oct 2026\u0026quot;,\u0026quot;Wed 14 Oct 2026\u0026quot;,\u0026quot;Tue 13 Oct 2026\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='bkHC-1' random-id='e29204dd-c04a-f311-5936
