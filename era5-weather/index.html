      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

z-demand/ldz-weather/\"\u003ELDZ weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003ELDZ Ens forecast\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003EModel specification\u003C/a\u003E\u003Ca href=\"/ldz-demand/model-calibration/\"\u003EModel calibration\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003EBacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003ELive forecasts\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EERA5\u003C/strong\u003E is ECMWF's reanalysis: a reconstruction of the weather every hour since 1940, made by\ncombining observations with a weather model. It is what the demand model is trained on \u2014 the same\nkind of 2 m temperature and 10 m wind fields that the ECMWF ensemble will forecast later.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe raw grid is 0.25\u00b0 (~28 km). Below, it is averaged into coarser square cells so each can be labelled,\nand you can step through the \u003Cstrong\u003Egas day\u003C/strong\u003E \u2014 05:00 to 05:00 UK time, the day gas demand is measured\nover. Pick one of a few days chosen from the archive for what they show.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem own prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eAttribution\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003EDrag the slider or press \u25b6 to step through the gas day. Hover a cell for its exact value.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETemperature\u003C/strong\u003E is coloured around \u003Cstrong\u003E15.5 \u00b0C\u003C/strong\u003E, roughly where space heating\n  switches on: blue cells need heating, and the deeper the blue the more. The scale is fixed\n  (\u22129.5 \u2192 40.5 \u00b0C), so days and hours compare directly.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWind\u003C/strong\u003E is 10 m wind speed on a fixed 0\u201320 m/s scale, dark purple (calm) through red and\n  orange to yellow (storm). Wind makes buildings lose heat faster, which is why the official CWV\n  includes it.\u003C/li\u003E\n\u003Cli\u003ECells cover sea as well as land; the offshore cells are milder in winter and cooler in summer.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003EERA5 hourly 2 m temperature and 10 m wind (u, v) over 61\u00b0N 8.5\u00b0W \u2013 49.5\u00b0N 2\u00b0E; wind speed = \u221a(u\u00b2 + v\u00b2).\u003C/li\u003E\n\u003Cli\u003EHours assigned to the UK gas day on the local wall clock (05:00 \u2192 05:00, 23 or 25 hours across clock changes).\u003C/li\u003E\n\u003Cli\u003ECells: the 0.25\u00b0 grid, cropped to mainland GB (49.75\u201359.5\u00b0N), averaged in blocks of 4 \u00d7 7 (~110 km)\n  or 2 \u00d7 3 (~55 km) grid points \u2014 wider in longitude so cells are square on the ground. Partial\n  blocks at the edge are dropped.\u003C/li\u003E\n\u003Cli\u003EHeadline temperature: mean over an England box (50.5\u201354\u00b0N, 3\u00b0W\u20130.5\u00b0E).\u003C/li\u003E\n\u003Cli\u003ECode: \u003Ccode\u003Eldz_demand.charts.era5\u003C/code\u003E \u00b7 data: \u003Ccode\u003Edocs/user_guide.md\u003C/code\u003E \u00a74.2.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EContains modified Copernicus Climate Change Service information [2021\u20132026]. Neither the European Commission nor ECMWF is responsible for any use of this information. Coastline: Natural Earth (public domain).\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.1", "script_metadata_hash": null}, "version": "1"},
