      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

ex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"what-was-done-free-data-weather-per-ldz-a-refitted-cwv-tested-forward-and-live\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EWhat was done |\u003C/span\u003E Free data, weather per LDZ, a refitted CWV, tested forward and live\u003C/h2\u003E\u003C/span\u003E\u003Cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(10em, 1fr)); gap: 0.75em\"\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.7em 0.9em\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003EThe problem\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.9em\"\u003Eone weather station per LDZ\u003C/div\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\" style=\"font-size: 0.9em\"\u003Enational gas data \u2192\u003C/a\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.7em 0.9em\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003EThe data\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.9em\"\u003Ethree free sources, five years\u003C/div\u003E\u003Ca href=\"/ldz-demand/era5-weather/\" style=\"font-size: 0.9em\"\u003EERA5 weather \u2192\u003C/a\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.7em 0.9em\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003EWeather per LDZ\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.9em\"\u003ESt Athan reads ~0.8 \u00b0C warm in Nov\u003C/div\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\" style=\"font-size: 0.9em\"\u003Eldz weather \u2192\u003C/a\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.7em 0.9em\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003EThe model\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.9em\"\u003Ethe CWV refitted, all LDZs at once\u003C/div\u003E\u003Ca href=\"/ldz-demand/model-specification/\" style=\"font-size: 0.9em\"\u003Emodel specification \u2192\u003C/a\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.7em 0.9em\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003ETested properly\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.9em\"\u003Eforward, three winters\u003C/div\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\" style=\"font-size: 0.9em\"\u003Ebacktesting results \u2192\u003C/a\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.7em 0.9em\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003EChecked live\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.9em\"\u003Eevery run scored as demand closes out\u003C/div\u003E\u003Ca href=\"/ldz-demand/error-analysis/\" style=\"font-size: 0.9em\"\u003Eerror analysis \u2192\u003C/a\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "18dca677cbb23ab819ce6957cfc217a9", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"live-record-93-of-closed-out-days-inside-p10p90-target-80-day-ahead-off-32\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003ELive record |\u003C/span\u003E 93% of closed-out days inside P\u003Csub\u003E10\u003C/sub\u003E\u2013P\u003Csub\u003E90\u003C/sub\u003E (target 80%); day-ahead off 3.2%\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E33 runs\u003C/strong\u003E since 13 Oct 2026, scored on 273 closed-out forecast days (\u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003ED+6\u003C/sub\u003E).\u003C/li\u003E\n\u003Cli\u003EA short record so far: each day is scored by up to 14 runs, so the days overlap. The test, and the\n  weather forecast on its own, are on \u003Ca href=\"/ldz-demand/error-analysis/\"\u003Eerror analysis\u003C/a\u003E.\u003C/li\u003E\n\u003Cli\u003EEvery run, LDZ by LDZ: \u003Ca href=\"/ldz-demand/live-forecasts/\"\u003Elive forecasts\u003C/a\u003E.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "24349b2984cdafe2fcf0aa64e4922b07", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"how-its-built-a-daily-job-on-a-home-server-a-database-and-a-static-snapshot\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EHow it's built |\u003C/span\u003E A daily job on a home server, a database, and a static snapshot\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EA \u003Cstrong\u003Edaily job\u003C/strong\u003E in Docker on a home server: download the ensemble, National Gas and ERA5 side by\n  side, build the tables, forecast every new run.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMySQL\u003C/strong\u003E for the tables; this site is a \u003Cstrong\u003Estatic snapshot\u003C/strong\u003E of the dashboard, rebuilt from them.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETests on every push\u003C/strong\u003E (GitHub Actions); every step is on the \u003Ca href=\"/ldz-demand/project-map/\"\u003Eproject map\u003C/a\u003E, and the\n  code is on \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EGitHub\u003C/a\u003E.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\"limits-weakest-in-spring-and-autumn-five-years-of-data\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003ELimits |\u003C/span\u003E Weakest in spring and autumn; five years of data\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EWeakest in the shoulder months\u003C/strong\u003E: spring and autumn, when heating switches on and off.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFive years of data\u003C/strong\u003E, so the post-2022 change and the cold end can't be fully separated.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERead on:\u003C/strong\u003E the \u003Ca href=\"/ldz-demand/summary/\"\u003Esummary\u003C/a\u003E for the full story \u00b7 the\n  \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Edecisions\u003C/a\u003E behind each choice \u00b7\n  \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/user_quickstart.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Erun it yourself\u003C/a\u003E in a few minutes.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4da560a287931556435a4220e180a7a0", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cdiv id=\"definitions\" style=\"margin-top: 2.5em; color: var(--muted-foreground); font-size: 0.9em; line-height: 1.7\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003E\u003Ci\u003EDefinitions\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003E\u003Ci\u003EQ\u003C/i\u003E\u003C/span\u003E \u2014 gas demand: LDZ total minus daily-metered, GWh per gas day\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003EP\u003Csub\u003E10\u003C/sub\u003E\u2013P\u003Csub\u003E90\u003C/sub\u003E\u003C/span\u003E \u2014 the forecast range \u003Ci\u003EQ\u003C/i\u003E falls in 8 times in 10; P\u003Csub\u003E50\u003C/sub\u003E is the median\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003E\u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003ED+1\u003C/sub\u003E, \u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003E
