[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ldz-demand"
version = "0.1.0"
description = "LDZ-level Composite Weather Variable (CWV) gas demand models with ECMWF ensemble forecasts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Robert Hemming" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "requests",
]

[project.optional-dependencies]
weather = ["xarray", "netCDF4", "cfgrib", "cdsapi", "ecmwf-opendata"]
geo = ["geopandas", "shapely", "scipy", "openpyxl", "pyproj"]
models = ["scikit-learn", "statsmodels", "optuna", "scipy", "holidays"]
forecast = ["scipy", "holidays"]    # running the fitted model (the Docker image); models adds the experiment tools
plot = ["matplotlib", "cartopy"]
db = ["sqlalchemy>=2.0", "pymysql", "cryptography", "python-dotenv"]
dashboard = ["marimo", "plotly"]
dev = ["pytest", "ruff~=0.17.3"]
all = ["ldz-demand[weather,geo,models,plot,db,dashboard]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ldz_demand.charts" = ["data/*.json"]
"ldz_demand.geo" = ["data/*.csv", "data/*.geojson"]
"ldz_demand.models" = ["data/*.csv", "data/results/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # our code must not use deprecated APIs: CI installs the latest libraries, so it sees them first
    "error::DeprecationWarning:ldz_demand",
    "error::FutureWarning:ldz_demand",
    # not ours: xarray's netCDF writer on numpy >= 2.5; a harmless binary-compatibility notice
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:xarray",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
extend-exclude = ["dashboard/__marimo__"]

[tool.ruff.lint]
# ruff's classic defaults (pyflakes and pycodestyle's error checks): real mistakes, not style.
# Listed so a new ruff release with wider defaults doesn't change what CI checks.
select = ["E4", "E7", "E9", "F"]

[tool.marimo.display]
# Marimo widget theme; keep in step with the chart theme (python -m ldz_demand.charts.style <name>)
theme = "dark"
