    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003Enational gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003Eldz geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003Eldz weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003Eldz ECMWF ensemble\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003Emodel specification\u003C/strong\u003E\u003Ca href=\"/ldz-demand/model-calibration/\"\u003Emodel calibration\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003Ebacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003Elive forecasts\u003C/a\u003E\u003Ca href=\"/ldz-demand/error-analysis/\"\u003Eerror analysis\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe official CWV's steps, refitted per LDZ to weather averaged over the LDZ: a day's weather becomes\none number, the CWV, and demand \u003Ci\u003EQ\u003C/i\u003E is a straight line in it plus the calendar.\u003C/strong\u003E\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{aligned}\nE_t \u0026amp;= y \\cdot E_{t-1} + (1-y)\\,T_t \u0026amp;\u0026amp; \\text{Memory}\\\\\nCW_t \u0026amp;= E_t - I_2 \\max(0, W_t - W_0)\\max(0, T_0 - T_t) \u0026amp;\u0026amp; \\text{Wind}\\\\\n\u0026amp;\\quad + S_0\\,SR_t \u0026amp;\u0026amp; \\text{Solar}\\\\\n\u0026amp;\\quad + S_c\\,g(\\text{day}) \u0026amp;\u0026amp; \\text{Season}\\\\\nCWV_t \u0026amp;= f(CW_t;\\ V_0, I_3, V_1, V_2, q) \u0026amp;\u0026amp; \\text{Bend}\\\\\nQ_t \u0026amp;= a + b\\,CWV_t + \\text{calendar}_t \u0026amp;\u0026amp; \\text{Demand}\n\\end{aligned}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ET\u003C/em\u003E is the gas day's temperature, weighted to the hours homes heat (\u003Cem\u003ETemperature\u003C/em\u003E); \u003Cem\u003EW\u003C/em\u003E the wind\nspeed; \u003Cem\u003ESR\u003C/em\u003E solar radiation: all ERA5, averaged over the LDZ and weighted by where gas is used. The\ncalendar is day of week, bank holidays and Christmas. Drawn with the final fit\n(\u003Ccode\u003Eldz_demand.models.fit\u003C/code\u003E; \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#cwv-model\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Edecisions C1\u2013C9\u003C/a\u003E); the fitted values for every LDZ\nare on \u003Ca href=\"/ldz-demand/model-calibration/\"\u003Emodel calibration\u003C/a\u003E, the scores on \u003Ca href=\"/ldz-demand/backtesting-results/\"\u003Ebacktesting results\u003C/a\u003E.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 13 November 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "4d2edc63d7e1593b75adc197fb7a6e49", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='vblA-0' random-id='822f3d28-7675-0079-9f65-594e7379d77a'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;NT\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eLDZ\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;EA\u0026quot;,\u0026quot;EM\u0026quot;,\u0026quot;NE\u0026quot;,\u0026quot;NO\u0026quot;,\u0026quot;NT\u0026quot;,\u0026quot;NW\u0026quot;,\u0026quot;SC\u0026quot;,\u0026quot;SE\u0026quot;,\u0026quot;SO\u0026quot;,\u0026quot;SW\u0026quot;,\u0026quot;WM\u0026quot;,\u0026quot;WN\u0026quot;,\u0026quot;WS\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "d0ac3e390a59fb3f027608dc23d22ed3", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "fc7a412dd60a7ebc8ab80956f0ec3b1e", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"temperature-heating-hours-count-double-and-nights-half-a-9-smaller-error\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003ETemperature |\u003C/span\u003E Heating hours count double and nights half: a 9% smaller error\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EA gas day runs 05:00 to 05:00. Rather than a flat average of its hours, the hours when homes heat\n  count more: \u003Cstrong\u003E06\u201309 and 16\u201322 double, 23\u201305 half\u003C/strong\u003E.\u003C/li\u003E\n\u003Cli\u003EThe largest single improvement after the seasonal term, and it survives the ensemble forecasts'\n  3- and 6-hourly steps (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#p5-gas-day-temperature-weighted-to-the-heating-hours\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EP5\u003C/a\u003E).\u003C/li\u003E\n\u003Cli\u003EIt is usually a little warmer than the flat mean: the coldest hours are at night, which now count\n  for less.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWeight of each hour (chart)\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cmarimo-plotly data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;hovertemplate\u0026quot;:\u0026quot;%{x}: weight %{y:.1f}\u0026#92;u003cextra\u0026#92;u003e\u0026#92;u003c/extra\u0026#92;u003e\u0026quot;,\u0026quot;marker\u0026quot;:{\u0026quot;color\u0026quot;:\u0026quot;#3987e5\u0026quot;},\u0026quot;x\u0026quot;:[\u0026quot;05:00\u0026quot;,\u0026quot;06:00\u0026quot;,\u0026quot;07:00\u0026quot;,\u0026quot;08:00\u0026quot;,\u0026quot;09:00\u0026quot;,\u0026quot;10:00\u0026quot;,\u0026quot;11:00\u0026quot;,\u0026quot;12:00\u0026quot;,\u0026quot;13:00\u0026quot;,\u0026quot;14:00\u0026quot;,\u0026quot;15:00\u0026quot;,\u0026quot;16:00\u0026quot;,\u0026quot;17:00\u0026quot;,\u0026quot;18:00\u0026quot;,\u0026quot;19:00\u0026quot;,\u0026quot;20:00\u0026quot;,\u0026quot;21:00\
