      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

 "name": "_"}, {"code": "", "code_hash": "9562642656ddd1e9cc01557f4799985b", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "emfo", "name": "_"}, {"code": "", "code_hash": "ad2a639deaff87484e8403ff6d20c319", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "Hstk", "name": "_"}], "metadata": {"marimo_version": "0.25.1"}, "version": "1"},
            "session": {"cells": [{"code_hash": "89d44514431012aaa56fd89d48de20e0", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "62d4a0c0cad70b1b1375cb5d6e2d0d58", "console": [], "id": "MJUe", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.75rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"ldz-weather\"\u003ELDZ weather\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EOne temperature per LDZ, every gas day: how much does the way we draw and weight the LDZ matter?\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.25em 2.5em\"\u003E\u003Cdiv style=\"flex: 0 0 auto\"\u003E\u003Cdiv style=\"display: grid; grid-template-columns: max-content max-content; width: fit-content; background: var(--muted); border-radius: 8px; padding: 0.5em 1.4em 0.5em 1.1em\"\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EProject\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/\"\u003EOverview\u003C/a\u003E\u003Ca href=\"/ldz-demand/project-map/\"\u003EProject map\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EDatasets\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003ENational Gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003ELDZ geography\u003C/a\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003ELDZ weather\u003C/strong\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003ELDZ Ens forecast\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003EModel specification\u003C/a\u003E\u003Ca href=\"/ldz-demand/model-calibration/\"\u003EModel calibration\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003EBacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003ELive forecasts\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe demand model takes each LDZ's weather as a \u003Cstrong\u003Eweighted mean of ERA5 grid cells\u003C/strong\u003E (0.25\u00b0,\nroughly 28 \u00d7 17 km). Which cells count, and how much, is a modelling choice with two parts, and\nthis page builds every combination rather than picking one:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EMembership:\u003C/strong\u003E which places belong to the LDZ. These are the four map methods from the\n  \u003Cem\u003ELDZ geography\u003C/em\u003E page: local authority, Voronoi, hybrid and sampled.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWeighting:\u003C/strong\u003E how the places inside the LDZ count. \u003Cstrong\u003EArea\u003C/strong\u003E weights every km\u00b2 of land\n  equally. \u003Cstrong\u003EGas use\u003C/strong\u003E weights each local authority by its annual gas consumption (DESNZ),\n  spread over its area.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EPlus the reference everything is measured against: the \u003Cstrong\u003Eofficial CWV's single weather\nstation\u003C/strong\u003E per LDZ. EA, NT and SE all use Heathrow, and NE uses Nottingham Watnall, which is in\nEM. The station's value comes from the four ERA5 grid points around it, not from the station's\nown readings.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWhat matters for the model\u003C/strong\u003E is the \u003Cem\u003Eday-to-day\u003C/em\u003E difference between variants. A constant offset,\nsuch as one variant always 0.3 \u00b0C warmer, is absorbed when the model is fitted. Noise that changes\nfrom day to day is not: it blurs the temperature\u2013demand relationship.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 24 October 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "2320a466f9ed71c15b3f11c79d93fdc3", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "5e47f9d21b75d3f4efc2819cbbfa45aa", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-where-each-ldzs-weather-comes-from\"\u003E1 \u00b7 Where each LDZ's weather comes from\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe cell weights behind each variant. Bigger, darker squares count for more. Gas-use weighting\npulls each LDZ towards its towns and cities; area weighting spreads it over hills and moors.\nCompare \u003Cem\u003EStation\u003C/em\u003E with any other variant to see how little of an LDZ one station represents.\u003C/span\u003E\u003C/span\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 2rem'\u003E\u003Cmarimo-ui-element object-id='bkHC-0' random-id='9feb506e-b55e-fb14-b0a9-94da821f4963'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;NT\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eLDZ\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;EA\u0026quot;,\u0026quot;EM\u0026quot;,\u0026quot;NE\u0026quot;,\u0026quot;NO\u0026quot;,\u0026quot;NT\u0026quot;,\u0026quot;NW\u0026quot;,\u0026quot;SC\u0026quot;,\u0026quot;SE\u0026quot;,\u0026quot;SO\u0026quot;,\u0026quot;SW\u0026quot;,\u0026quot;WM\u0026quot;,\u0026quot;WN\u0026quot;,\u0026quot;WS\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='bkHC-1' random-id='c0a77a5a-19f4-4ffd-3440-490dc8acab2a'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;Sampled \u00b7 gas use\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92 ions are \u2014 which our gas-weighted temperature shouldn't need.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='emfo-0' random-id='c699a304-cc76-ad59-7c40-e910b568da97'\u003E\u003Cmarimo-plotly data-initial-value='{}' data-label='null' data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;colorbar\u0026quot;:{\u0026quot;len\u0026quot;:0.7,\u0026quot;outlinewidth\u0026quot;:0,\u0026quot;thickness\u0026quot;:10,\u0026quot;title\u0026quot;:{\u0026quot;text\u0026quot;:\u0026quot;\u00b0C\u0026quot;}},\u0026quot;colorscale\u0026quot;:[[0.0,\u0026quot;#184f95\u0026quot;],[0.16666666666666666,\u0026quot;#2a78d6\u0026quot;],[0.3333333333333333,\u0026quot;#6da7ec\u0026quot;],[0.5,\u0026quot;#45443f\u0026quot;],[0.6666666666666666,\u0026quot;#ec8a8a\u0026quot;],[0.8333333333333334,\u0026quot;#e34948\u0026quot;],[1.0,\u0026quot;#a8302f\u0026quot;]],\u0026quot;customdata\u0026quot;:[[\u0026quot;station +0.62 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.50)\u0026quot;,\u0026quot;station +0.39 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.50)\u0026quot;,\u0026quot;station +0.47 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.64)\u0026quot;,\u0026quot;station +0.31 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.72)\u0026quot;,\u0026quot;station +0.56 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.59)\u0026quot;,\u0026quot;station +0.59 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.57)\u0026quot;,\u0026quot;station +0.76 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.47)\u0026quot;,\u0026quot;station +1.00 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.71)\u0026quot;,\u0026quot;station +1.24 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.69)\u0026quot;,\u0026quot;station +1.23 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.68)\u0026quot;,\u0026quot;station +1.11 \u00b0C vs Sampled \u00b7 gas use (day to day \u00b10.64)\u0026quot;,\u0026quot;station +0.83 \u00b0C vs Sampled \u00b7 gas use
