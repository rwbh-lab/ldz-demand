      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "notebook": {"cells": [{"code": "", "code_hash": "ed9a8080fb19f4f8e8c6e29f96b1edc5", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "Hbol", "name": "_"}, {"code": "", "code_hash": "29d483f40f5a2971cab494b631d40b30", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "MJUe", "name": "_"}, {"code": "", "code_hash": "735fd3f406d46b300933ea5711dfbe27", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "vblA", "name": "_"}, {"code": "", "code_hash": "d0ac3e390a59fb3f027608dc23d22ed3", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "bkHC", "name": "_"}, {"code": "", "code_hash": "89ddcf944606a388e17ed80e7a731198", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "lEQa", "name": "_"}, {"code": "", "code_hash": "d91dfb7425ceb3400a778c8f8ab4ac8f", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "PKri", "name": "_"}, {"code": "", "code_hash": "f2fc3c9166018df11dc51556e4d7c13d", "config": {"column": null, "disabled": false, "expand_output": false, "hide_code": true}, "id": "Xref", "name": "_"}], "metadata": {"marimo_version": "0.25.1"}, "version": "1"},
            "session": {"cells": [{"code_hash": "ed9a8080fb19f4f8e8c6e29f96b1edc5", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "29d483f40f5a2971cab494b631d40b30", "console": [], "id": "MJUe", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.75rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"model-calibration\"\u003EModel calibration\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EHow the model's parameters are fitted to five years of demand, and what they came out as.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.25em 2.5em\"\u003E\u003Cdiv style=\"flex: 0 0 auto\"\u003E\u003Cdiv style=\"display: grid; grid-template-columns: max-content max-content; width: fit-content; background: var(--muted); border-radius: 8px; padding: 0.5em 1.4em 0.5em 1.1em\"\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EProject\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/\"\u003EOverview\u003C/a\u003E\u003Ca href=\"/ldz-demand/project-map/\"\u003EProject map\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EDatasets\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003ENational Gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003ELDZ geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003ELDZ weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003ELDZ Ens forecast\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003EModel specification\u003C/a\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003EModel calibration\u003C/strong\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003EBacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003ELive forecasts\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe \u003Ca href=\"/ldz-demand/model-specification/\"\u003EModel specification\u003C/a\u003E sets out the model's form; here it meets the data.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhat it is fitted to:\u003C/strong\u003E each LDZ's total demand minus its daily-metered demand, per gas day \u2014 the\n  demand the weather drives (\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003ENational Gas data\u003C/a\u003E, Part II). The 18 months when South\n  East's total was missing a feed are repaired for fitting.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EInputs:\u003C/strong\u003E the LDZ weather built from ERA5 \u2014 the heating-hours gas-day temperature, wind and\n  solar (\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003ELDZ weather\u003C/a\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EHow:\u003C/strong\u003E all thirteen LDZs are fitted together, because the seasonal shape is shared, by \u003Cstrong\u003Erobust\n  least squares\u003C/strong\u003E (a soft-L1 loss: large errors count less than when squared, so a few odd days\n  can't drag the fit). Each parameter is held within a physically sensible range; the cold-weather\n  upturn is held near the published values, as five years have few cold days.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhich days:\u003C/strong\u003E every usable day in the five gas years, with recent years counting more (\u00a71).\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EHow well the fitted model predicts days it wasn't fitted on is on \u003Ca href=\"/ldz-demand/backtesting-results/\"\u003EBacktesting results\u003C/a\u003E.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 24 October 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "735fd3f406d46b300933ea5711dfbe27", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='vblA-0' random-id='b6bc2f9c-054e-57df-7343-cc8537638660'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;NT\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eLDZ\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;EA\u0026quot;,\u0026quot;EM\u0026quot;,\u0026quot;NE\u0026quot;,\u0026quot;NO\u0026quot;,\u0026quot;NT\u0026quot;,\u0026quot;NW\u0026quot;,\u0026quot;SC\u0026quot;,\u0026quot;SE\u0026quot;,\u0026quot;SO\u0026quot;,\u0026quot;SW\u0026quot;,\u0026quot;WM\u0026quot;,\u0026quot;WN\u0026quot;,\u0026quot;WS\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "d0ac3e390a59fb3f027608dc23d22ed3", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "89ddcf944606a388e17ed80e7a731198", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-following-behaviour-recent-years-count-more\"\u003E1 \u00b7 Following behaviour: recent years count more\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EDemand fell after the 2022 price shock and has partly recovered since. Rather than pick break\ndates, each training day is \u003Cstrong\u003Eweighted by its age, halving every 1 year\u003C/strong\u003E,\nso the model follows how people use gas now (\u003Ccode\u003Edecisions.md\u003C/code\u003E C7).\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-plotly data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;fill\u0026quot;:\u0026quot;tozeroy\u0026quot;,\u0026quot;fillcolor\u0026quot;:\u0026quot;rgba(57,135,229,0.2)\u0026quot;,\u0026quot;hovertemplate\u0026quot;:\u0026quot;%{x|%d %b %Y}: weight %{y:.2f}\u0026#92;u003cextra\u0026#92;u003e\u0026#92;u003c/extra\u0026#92;u003e\u0026quot;,\u0026quot;line\
