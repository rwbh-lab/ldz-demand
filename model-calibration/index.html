      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

 padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003Enational gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003Eldz geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003Eldz weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003Eldz ECMWF ensemble\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003Emodel specification\u003C/a\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003Emodel calibration\u003C/strong\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003Ebacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003Elive forecasts\u003C/a\u003E\u003Ca href=\"/ldz-demand/error-analysis/\"\u003Eerror analysis\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EAll 13 LDZs are fitted together on five gas years of \u003Ci\u003EQ\u003C/i\u003E, with recent years counting more, by a\nloss that keeps a few odd days from dragging the fit.\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ERecency\u003C/strong\u003E: how the fit follows the way gas is used now.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EParameters\u003C/strong\u003E: one LDZ's fitted values against the published ones.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAlternatives\u003C/strong\u003E: what else was tried, and why it lost.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThe model's form is on \u003Ca href=\"/ldz-demand/model-specification/\"\u003Emodel specification\u003C/a\u003E; how well it predicts days it\nwasn't fitted on, on \u003Ca href=\"/ldz-demand/backtesting-results/\"\u003Ebacktesting results\u003C/a\u003E.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 20 November 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "5bd0128c8f77c943990cdfb7716ffa83", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eHow the fit works\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhat it is fitted to:\u003C/strong\u003E each LDZ's \u003Ci\u003EQ\u003C/i\u003E, total demand minus daily-metered, per gas day: the\n  demand the weather drives (\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003Enational gas data\u003C/a\u003E, Part II). The 18 months when\n  South East's total was missing a feed are repaired for fitting.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EInputs:\u003C/strong\u003E the LDZ weather built from ERA5: the heating-hours gas-day temperature, wind and\n  solar (\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003Eldz weather\u003C/a\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EHow:\u003C/strong\u003E all thirteen LDZs together, because the seasonal shape is shared, by \u003Cstrong\u003Erobust least\n  squares\u003C/strong\u003E (a soft-L1 loss: large errors count less than when squared, so a few odd days can't\n  drag the fit). Each parameter is held within a physically sensible range.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe cold-weather upturn\u003C/strong\u003E is capped at 0.4, or twice the published strength if that is more:\n  five years have too few very cold days to pin it down. The fit reaches the cap in\n  7 LDZs (EA, EM, NO, NT, SE, SO, SW); lifting it changes the coldest days by under\n  0.1 GWh/day (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#c4-a-fitted-cold-weather-upturn-bounded\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EC4\u003C/a\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhich days:\u003C/strong\u003E every usable day in the five gas years, recent years counting more (next).\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003Cmarimo-ui-element object-id='vblA-0' random-id='457acb79-459b-27f2-a5e2-a6f9eb777124'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;NT\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eLDZ\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;EA\u0026quot;,\u0026quot;EM\u0026quot;,\u0026quot;NE\u0026quot;,\u0026quot;NO\u0026quot;,\u0026quot;NT\u0026quot;,\u0026quot;NW\u0026quot;,\u0026quot;SC\u0026quot;,\u0026quot;SE\u0026quot;,\u0026quot;SO\u0026quot;,\u0026quot;SW\u0026quot;,\u0026quot;WM\u0026quot;,\u0026quot;WN\u0026quot;,\u0026quot;WS\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "d0ac3e390a59fb3f027608dc23d22ed3", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "aab548d97cbbbe820f09a49f8220477c", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"recency-each-days-weight-halves-every-year-so-the-model-follows-demand-since-2022\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003ERecency |\u003C/span\u003E Each day's weight halves every year: so the model follows demand since 2022\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EDemand fell after the 2022 price shock and has partly recovered since.\u003C/li\u003E\n\u003Cli\u003ERather than pick break dates, each training day is weighted by its age\n  (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#c7-follow-behaviour-by-weighting-recent-years\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EC7\u003C/a\u003E).\u003C/li\u003E\n\u003Cli\u003EBelow the weights, what that adjusts for: actual demand against today's model, month by month.\n  Earlier years sit above zero, where demand was higher than now; recent months sit close to it.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-plotly data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;fill\u0026quot;:\u0026quot;tozeroy\u0026quot;,\u0026quot;fillcolor\u0026quot;:\u0026quot;rgba(57,135,229,0.2)\u0026quot;,\u0026quot;hovertemplate\u0026quot;:\u0026quot;%{x|%d %b %Y}: weight %{y:.2f}\u0026#92;u003cextra\u0026#92;u003e\u0026#92;u003c/extra\u0026#92;u003e\u0026quot;,\u0026quot;line\u0026quot;:{\u0026quot;color\u0026quot;:\u0026quot;#3987e5\u0026quot;,\u0026quot;width\u0026quot;:1.5},\u0026quot;x\u0026quot;:[\u0026quot;2021-10-12T00:00:00.000000\u0026quot;,\u0026quot;2021-10-13T00:00:00.000000\u0026quot;,\u0026quot;2021-10-14T00:00:00.000000\u0026quot;,\u0026quot;2021-10-15T00:00:00.000000\u0026quot;,\u0026quot;2021-10-16T00:00:00.000000\u0026quot;,\u0026quot;2021-10-17T00:00:00.000000\u0026quot;,\u0026quot;2021-10-18T00:00:00.000000\u0026quot;,\u0026quot;2021-10-19T00:00:00.000000\u0026quot;,\u0026quot;2021-10-20T00:00:00.000000\u0026quot;,\u0026quot;2021-10-21T00:00:00.000000\u0026quot;,\u0026quot;2021-10-22T00:00:00.000000\u0026quot;,\u0026quot;2021-10-23T00:00:00.000000\u0026quot;,\u0026quot;2021-10-24T00:00:00.000000\u0026quot;,\u0026quot;2021-10-25T00:00:00.000000\u0026quot;,\u0026quot;2021-10-26T00:00:00.000000\u0026quot;,\u0026quot;2021-10-27T00:00:00.000000\u0026quot;,\u0026quot;2021-10-28T00:00:00.000000\u0026quot;,\u0026quot;2021-10-29T00:00:00.000000\u0026quot;,\u0026quot;2021-10-30T00:00:00.000000\u0026quot;,\u0026quot;2021-10-31T00:00:00.000000\u0026quot;,\u0026quot;2021-11-01T00:00:00.000000\u0026quot;,\u0026quot;2021-11-02T00:00:00.000000\u0026quot;,\u0026quot;2021-11-03T00:00:00.000000\u0026quot;,\u0026quot;2021-11-04T00:00:00.000000\u0026quot;,\u0026quot;2021-11-05T00:00:00.000000\u0026quot;, an class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"display: flex; justify-content: center; margin: 1em 0\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ETerm\u003C/th\u003E\n\u003Cth\u003EValue\u003C/th\u003E\n\u003Cth\u003EUnit\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EIntercept (a)\u003C/td\u003E\n\u003Ctd\u003E169.1\u003C/td\u003E\n\u003Ctd\u003EGWh/day\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ESlope on CWV (b)\u003C/td\u003E\n\u003Ctd\u003E-6.81\u003C/td\u003E\n\u003Ctd\u003EGWh/day per \u00b0C\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\u003C/div\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "c5e605ffe8e304c0766820eb75eefb6d", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"alternatives-six-tried-each-scored-worse-gained-nothing-net-or-was-held-back\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EAlternatives |\u003C/span\u003E Six tried; each scored worse, gained nothing net, or was held back\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EEach was fitted and scored the same way; the reasons are in the \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Edecisions\u003C/a\u003E, the scores in\nthe \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/results.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eresults\u003C/a\u003E.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ENo seasonal term\u003C/strong\u003E: 17% worse; a \u003Cstrong\u003Eslow \"heating-season\" temperature\u003C/strong\u003E instead of the shape:\n  close behind (C2).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe official form of the seasonal term\u003C/strong\u003E: no unique solution, so rewritten (C3).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EA straight line instead of the cold upturn\u003C/strong\u003E, or \u003Cstrong\u003Ethe published upturn\u003C/strong\u003E: both worse on cold\n  days (C4).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EA separate summer level\u003C/strong\u003E: better in July\u2013August, worse in spring; no net gain (C5).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EFixed coefficients\u003C/strong\u003E, \u003Cstrong\u003Ea break in autumn 2022\u003C/strong\u003E, \u003Cstrong\u003Ea level per gas year\u003C/strong\u003E: recency weighting\n  beat them over three forward years (C7).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe day's minimum / maximum temperature\u003C/strong\u003E: a small gain, held back because ERA5 and the\n  ensemble define them differently (N2).\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4da560a287931556435a4220e180a7a0", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cdiv id=\"definitions\" style=\"margin-top: 2.5em; color: var(--muted-foreground); font-size: 0.9em; line-height: 1.7\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003E\u003Ci\u003EDefinitions\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003E\u003Ci\u003EQ\u003C/i\u003E\u003C/span\u003E \u2014 gas demand: LDZ total minus daily-metered, GWh per gas day\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003EP\u003Csub\u003E10\u003C/sub\u003E\u2013P\u003Csub\u003E90\u003C/sub\u003E\u003C/span\u003E \u2014 the forecast range \u003Ci\u003EQ\u003C/i\u003E falls in 8 times in 10; P\u003Csub\u003E50\u003C/sub\u003E is the median\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003E\u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003ED+1\u003C/sub\u003E, \u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003
