    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003Enational gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003Eldz geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003Eldz weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003Eldz ECMWF ensemble\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003Emodel specification\u003C/a\u003E\u003Ca href=\"/ldz-demand/model-calibration/\"\u003Emodel calibration\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003Ebacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003Elive forecasts\u003C/a\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003Eerror analysis\u003C/strong\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EA P\u003Csub\u003E10\u003C/sub\u003E\u2013P\u003Csub\u003E90\u003C/sub\u003E range should hold demand on 8 days in 10. Scored so far on a few autumn weeks, the\npublished range holds more than that at longer lead times, and the weather forecast behind it is too\nnarrow on the first days. It takes a winter to be sure.\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ECoverage\u003C/strong\u003E: how often closed-out demand \u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003ED+6\u003C/sub\u003E lands inside the range, and a test of it.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EBias\u003C/strong\u003E: whether the median runs high or low.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETails\u003C/strong\u003E: where demand lands among all the percentiles, not just P\u003Csub\u003E10\u003C/sub\u003E\u2013P\u003Csub\u003E90\u003C/sub\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWeather alone\u003C/strong\u003E: where the weather that happened lands among the 50 members, without the\n  demand model.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EOnly closed-out (D+6) days are scored. The ranges combine the members' weather with the model's own\nerrors (\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003Elive forecasts\u003C/a\u003E, \u003Cem\u003EHow the ranges are built\u003C/em\u003E), so the two are scored apart:\nthe published range against demand, and the members against ERA5's weather.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 13 November 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "93315890ac3eb776540ed466263a82ee", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='vblA-0' random-id='1f7757ea-99 3cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eBy lead band (table)\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEach scored pair is inside the range or not. If the range is right, the chance it is inside is 0.8.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EHypotheses.\u003C/strong\u003E H\u2080: \u003Cem\u003Ep\u003C/em\u003E = 0.80; H\u2081: \u003Cem\u003Ep\u003C/em\u003E \u2260 0.80 (too wide and too narrow are both wrong).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EData.\u003C/strong\u003E 253 of \u003Cem\u003En\u003C/em\u003E = 273 pairs inside: \u003Cem\u003Ep\u0302\u003C/em\u003E = 0.927.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENaive test\u003C/strong\u003E, as if every pair were independent. SE under H\u2080 = \u221a(0.8 \u00d7 0.2 / 273) =\n   0.0242; \u003Cem\u003Ez\u003C/em\u003E = (0.927 \u2212 0.800) / 0.0242 = \u003Cstrong\u003E5.24\u003C/strong\u003E;\n   exact binomial \u003Cem\u003Ep\u003C/em\u003E below 0.001.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhy that overstates it.\u003C/strong\u003E The pairs cover only 26 gas days, each scored by up to\n   14 runs against one actual: one surprising day is several misses at once.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECluster-robust test\u003C/strong\u003E, with the gas day as the unit: SE = \u221a(G/(G\u22121) \u00b7 \u03a3(k\u1d62 \u2212 \u003Cem\u003Ep\u0302\u003C/em\u003E n\u1d62)\u00b2) / \u003Cem\u003En\u003C/em\u003E\n   = 0.0234 (G = 26); \u003Cem\u003Et\u003C/em\u003E = \u003Cstrong\u003E5.42\u003C/strong\u003E on 25 degrees of\n   freedom, \u003Cem\u003Ep\u003C/em\u003E below 0.001; 95% interval 88% to 97%. The design\n   effect, 2.2, makes the 273 pairs worth about 124 independent ones.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EOne forecast per day\u003C/strong\u003E, lead day 0 alone: 22 of 26 = 85%; exact\n   \u003Cem\u003Ep\u003C/em\u003E 0.806, 95% interval 65% to 96%.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECaveat.\u003C/strong\u003E Clustering by day doesn't remove the rest of the dependence: neighbouring days share\n   the weather, so the true number of independent days is smaller and these \u003Cem\u003Ep\u003C/em\u003E-values are optimistic.\n   Telling 80% from 90% at one lead time (5% two-sided, 80% power) needs about\n   ((1.96\u00b7\u221a0.16 + 0.84\u00b7\u221a0.09) / 0.1)\u00b2 \u2248 108 independent days: about a winter.\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"display: flex; justify-content: center; margin: 1em 0\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003ELead days\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EPairs\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EGas days\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EPublished range\u003C/th\u003E\n\u003Cth style=\"text-align: right;\"\u003EWeather only\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E0\u20133\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E98\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E26\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E90%\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E56%\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E4\u20138\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E100\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E22\u003C/td\u003E\n\u003Ctd style=\"text-align: right;\"\u003E94%\u003C/td\u003E\n\u003Ct
