    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "eec45dcfae0b52ce26d9166dfbc482f7", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "148999a76132ee3fff06e9504238cbd5", "console": [], "id": "MJUe", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.75rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"project-map\"\u003EProject map\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EFrom public data to a demand forecast: what feeds what, and the code behind each step.\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003Cdiv style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1.25em 2.5em\"\u003E\u003Cdiv style=\"flex: 0 0 auto\"\u003E\u003Cdiv style=\"display: grid; grid-template-columns: max-content max-content; width: fit-content; background: var(--muted); border-radius: 8px; padding: 0.5em 1.4em 0.5em 1.1em\"\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EProject\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/\"\u003EOverview\u003C/a\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003EProject map\u003C/strong\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EDatasets\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003ENational Gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003ELDZ geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003ELDZ weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003ELDZ Ens forecast\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003EModel specification\u003C/a\u003E\u003Ca href=\"/ldz-demand/model-calibration/\"\u003EModel calibration\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003EBacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003ELive forecasts\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ERead top to bottom. \u003Cstrong\u003ESources\u003C/strong\u003E are downloaded and archived as \u003Cstrong\u003Edatasets\u003C/strong\u003E. The \u003Cstrong\u003Epre-CWV models\u003C/strong\u003E\nturn those into what the demand model needs \u2014 a clean target, and weather for each LDZ, weighted\nby where gas is used. The \u003Cstrong\u003ECWV model\u003C/strong\u003E turns that weather into a composite weather variable and\ndemand, and its \u003Cstrong\u003Eoutputs\u003C/strong\u003E are scored predictions, the benchmark against National Gas, and (next)\ndemand forecasts from the ECMWF ensemble. The strip underneath is used throughout.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 24 October 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "f3c30fce25b89ccaf62cacd0c7cb4033", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Ciframe srcdoc='\u0026lt;!doctype html\u0026gt;\u0026lt;html lang=\u0026quot;en\u0026quot;\u0026gt;\u0026lt;head\u0026gt;\u0026lt;meta charset=\u0026quot;utf-8\u0026quot;\u0026gt;\u0026lt;meta name=\u0026quot;viewport\u0026quot; content=\u0026quot;width=device-width, initial-scale=1\u0026quot;\u0026gt;\u0026lt;title\u0026gt;Project map\u0026lt;/title\u0026gt;\u0026lt;style\u0026gt;\n:root { color-scheme: dark; }\nhtml, body { margin: 0; background: #1f1e1d; color: #faf9f5; font-family: system-ui, -apple-system, \u0026quot;Segoe UI\u0026quot;, Roboto, sans-serif; }\nhtml { overflow: hidden; }  /* the frame is sized to the page (fit() in the script) */\nbody { padding: 1px 0; }     /* keeps the hint\u0026#x27;s margin inside the body, so it is measured */\n.wrap { position: relative; }\nsvg { display: block; width: 100%; height: auto; }\n.band { fill: #faf9f5; fill-opacity: .035; }\n.col { fill: #8f8d85; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }\n.node { cursor: pointer; outline: none; }\n.node .box { fill: #262624; stroke: #45443f; stroke-width: 1; }\n.node:hover .box, .node:focus-visible .box { stroke: #c2c0b6; }\n.node .t { fill: #faf9f5; font-size: 12px; font-weight: 600; }\n.node .s { fill: #8f8d85; font-size: 11px; }\n.edge { cursor: pointer; }\n.edge .line { fill: none; stroke: #8f8d85; str
