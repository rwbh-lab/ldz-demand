# Settings inside the ldz-demand container (LDZ_DEMAND_CONFIG points here instead of local.ini).
# Mount the raw archive at /data/raw; pass database credentials as LDZ_DB_* variables (--env-file .env).
[storage]
database = true
raw_dir = /data/raw

[ecmwf_ens]
# in the daily job, catch up at most the latest run and the one before (older gaps: pull them by hand)
days_back = 1
