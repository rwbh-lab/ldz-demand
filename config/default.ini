# Committed defaults. Override locally in config/local.ini (gitignored).

[storage]
# false -> processed tables written as CSV to cache_dir (no setup needed)
# true  -> processed tables written to MySQL (connection details in .env)
database = false
cache_dir = data/cache
raw_dir = data/raw

[national_gas]
base_url = https://data.nationalgas.com/api/find-gas-data-download

[era5]
# First month to download. A month before the demand history (2021-10-12) so the
# effective-temperature smoothing has spin-up data.
start = 2021-09
# GB bounding box, degrees: north, west, south, east
area = 61, -8.5, 49.5, 2.0
