# Committed defaults. Override locally in config/local.ini (gitignored).

[storage]
# false -> processed tables written as CSV to cache_dir (no setup needed)
# true  -> processed tables written to MySQL (connection details in .env)
database = false
cache_dir = data/cache
raw_dir = data/raw

[national_gas]
base_url = https://data.nationalgas.com/api/find-gas-data-download

[era5]
# First month to download. A month before the demand history (2021-10-12) so the
# effective-temperature smoothing has spin-up data.
start = 2021-09
# GB bounding box, degrees: north, west, south, east
area = 61, -8.5, 49.5, 2.0

[ecmwf_ens]
# ECMWF open-data ensemble: the 00z run, out to 15 days, cropped to the ERA5 box on download.
# source: ecmwf (open-data portal, keeps the last few days) or a mirror: aws, azure, google
source = ecmwf
run_hour = 0
# forecast hours: 3-hourly to day 6, 6-hourly to day 15
steps = 0-144/3,150-360/6
area = ${era5:area}
# refresh also fetches any of this many previous days' runs that are missing
days_back = 3
