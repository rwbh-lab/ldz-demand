# Committed defaults. Override locally in config/local.ini (gitignored).

[storage]
# false -> processed series written as CSV to cache_dir (no setup needed)
# true  -> processed series written via an injected database store
database = false
cache_dir = data/cache
raw_dir = data/raw

[national_gas]
base_url = https://data.nationalgas.com/api/find-gas-data-download
