    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003Enational gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003Eldz geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003Eldz weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003Eldz ECMWF ensemble\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003Emodel specification\u003C/a\u003E\u003Ca href=\"/ldz-demand/model-calibration/\"\u003Emodel calibration\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/backtesting-results/\"\u003Ebacktesting results\u003C/a\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003Elive forecasts\u003C/a\u003E\u003Ca href=\"/ldz-demand/error-analysis/\"\u003Eerror analysis\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EWeather averaged over each LDZ and weighted to where gas is used explains Great Britain's gas demand\nbetter than the industry's one station per LDZ: out of sample, GB error is 9% below the official\nComposite Weather Variable's (CWV) over all days, and 29% below on the coldest days.\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe project rebuilds the CWV from gridded reanalysis (ERA5) for each of the 13 Local Distribution\nZones (LDZs), refits its form to five years of measured demand, and runs every member of the ECMWF\nensemble through the fitted model to forecast demand two weeks ahead as a range rather than a single\nnumber. In the winters scored it beats National Gas's published day-ahead forecasts; over the whole\nyear it is level with them. Everything uses free, public data.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 13 November 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "8300da202f10714c8b5206195cd62e20", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5em, 1fr)); gap: 0.6em\"\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.55em 0.85em\"\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003EError vs official CWV\u003C/div\u003E\u003Cdiv style=\"color: var(--foreground); font-size: 1.6em; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums\"\u003E\u22129%\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003EGB RMSE, all days, out of sample\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.55em 0.85em\"\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003EOn the coldest days\u003C/div\u003E\u003Cdiv style=\"color: var(--foreground); font-size: 1.6em; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums\"\u003E\u221229%\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003Ecoldest 5% of days\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.55em 0.85em\"\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003EWinter error per day\u003C/div\u003E\u003Cdiv style=\"color: var(--foreground); font-size: 1.6em; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums\"\u003E1.9\u20132.2%\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003ENational Gas 3.2\u20133.6%\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"border: 1px solid var(--border); border-radius: 8px; padding: 0.55em 0.85em\"\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003EOver the whole year\u003C/div\u003E\u003Cdiv style=\"color: var(--foreground); font-size: 1.6em; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums\"\u003E3.2\u20133.3%\u003C/div\u003E\u003Cdiv style=\"color: var(--muted-foreground); font-size: 0.8em\"\u003ENational Gas 3.1\u20133.6%: level\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "5015ff8009f45b1eb1c87e2c5507985a", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style=\"border-left: 3px solid var(--border); padding: 0.2em 0 0.2em 0.9em; margin: 0.4em 0\"\u003E\u003Cb\u003EHow this would be shown wrong.\u003C/b\u003E Over winter 2026/27 (October to March), scored on closed-out \u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003ED+6\u003C/sub\u003E: if fewer than 7 or more than 9 GB days in 10 fall inside the day-ahead P\u003Csub\u003E10\u003C/sub\u003E\u2013P\u003Csub\u003E90\u003C/sub\u003E (it should be 8 in 10), or if the day-ahead error per gas day is not at least 25% below National Gas's on the same days (the backtest has it 30\u201345% below), the forecast claim fails.\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "c94a16cac9da75da40588fdc34d00e2f", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"four-choices-carry-the-result\"\u003EFour choices carry the result\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe target is total minus daily-metered\u003C/strong\u003E, not the non-daily-metered that National Gas allocates. \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#p1-target-total--dm-not-ndm\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EP1\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe gas day's temperature weights the heating hours\u003C/strong\u003E: 9% lower error than a flat daily mean.\n  \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#p5-gas-day-temperature-weighted-to-the-heating-hours\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EP5\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EOne seasonal shape shared by all 13 LDZs\u003C/strong\u003E, sized per LDZ, estimated from thirteen times the data.\n  \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#c2-a-seasonal-shape-shared-by-all-ldzs\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EC2\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERecent years weighted more\u003C/strong\u003E (half-life one year), to follow the post-2022 fall in demand without\n  hand-picked break dates. \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md#c7-follow-behaviour-by-weighting-recent-years\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EC7\u003C/a\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7b0c711e11d912b35459b8ea785b233c", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 1.25rem'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"introduction-one-weather-station-per-ldz-misses-where-the-gas-is-used\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EIntroduction |\u003C/span\u003E One weather station per LDZ misses where the gas is used\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EA January day takes nearly six times the gas of a summer one, mostly homes and small businesses heating.\u003C/li\u003E\n\u003Cli\u003EThe industry forecasts and allocates that demand per LDZ with the CWV, built from \u003Cstrong\u003Eone station per\n  LDZ\u003C/strong\u003E: Heathrow for East Anglia, North Thames and South East alike.\u003C/li\u003E\n\u003Cli\u003EA station can be unrepresentative: St Athan reads up to 0.85 \u00b0C warmer in November than where Wales\n  South's gas is used.\u003C/li\u003E\n\u003Cli\u003EThe question here: how much better does weather over the whole LDZ, weighted to gas use, do? The full\n  chain is on the \u003Ca href=\"/ldz-demand/project-map/\"\u003Eproject map\u003C/a\u003E.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMore detail\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EGas demand in Great Britain swings with the weather: a January day takes nearly six times the gas\nof a summer one. Most of that swing is non-daily-metered demand \u2014 homes and small businesses heating\n\u2014 and the industry forecasts it per LDZ from the \u003Cstrong\u003EComposite Weather Variable\u003C/strong\u003E: a blend of\ntemperature, wind, sunshine and a seasonal profile, bent so that demand responds to it in a straight\nline. National Gas forecasts demand with it; Xoserve allocates gas to shippers with it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe official CWV takes its weather from \u003Cstrong\u003Eone station per LDZ\u003C/strong\u003E \u2014 Heathrow for East Anglia, North\nThames and South East alike. A station is one point, and not always a representative one: St Athan,\non the coast, reads up to 0.85 \u00b0C warmer in November than the places where Wales South's gas is\nused. This project asks how much better demand can be explained, and forecast, with weather averaged\nover the whole LDZ and weighted to where the gas goes \u2014 and builds the forecasts that follow.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe whole chain, from public data to a demand forecast, with the code behind each step, is on the\n\u003Ca href=\"/ldz-demand/project-map/\"\u003Eproject map\u003C/a\u003E.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"data-three-public-sources-free-data-access-for-every-gas-day\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EData |\u003C/span\u003E Three public sources, free data access, for every gas day\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ENational Gas\u003C/strong\u003E: daily LDZ demand, the official CWV and National Gas's own forecasts, a rolling five\n  years from October 2021.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EERA5\u003C/strong\u003E: hourly reanalysis on a 0.25\u00b0 grid.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe ECMWF ensemble\u003C/strong\u003E: each day's 00z run, 50 members, 15 days.\u003C/li\u003E\n\u003Cli\u003EThe weather is averaged over each \u003Cstrong\u003Egas day\u003C/strong\u003E, 05:00 to 05:00 UK time, the day National Gas reports\n  demand on, so weather and demand line up day for day.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMore detail\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ENational Gas\u003C/strong\u003E (data portal): daily LDZ demand and its daily- and non-daily-metered parts, the\n  official CWV, the gas entering each LDZ from the national transmission system, and National Gas's\n  own demand forecasts \u2014 a rolling five years, from October 2021. \u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003ENational Gas data\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EERA5\u003C/strong\u003E (Copernicus): hourly reanalysis on a 0.25\u00b0 grid \u2014 temperature, wind, solar radiation,\n  precipitation. \u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe ECMWF ensemble\u003C/strong\u003E (open data): each day's 00z run, 50 members, 15 days, cropped to GB as it\n  downloads and archived daily on a home server.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"pre-cwv-models-a-target-that-isnt-circular-an-ldz-map-and-weather-weighted-to-gas-use\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EPre-CWV models |\u003C/span\u003E A target that isn't circular, an LDZ map, and weather weighted to gas use\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe target\u003C/strong\u003E is total demand minus daily-metered: the published non-daily-metered figure is\n  allocated with the official CWV, so fitting to it would be circular.\u003C/li\u003E\n\u003Cli\u003EA \u003Cstrong\u003E31 GWh/day feed missing\u003C/strong\u003E from South East's total for 18 months is repaired for training and never\n  used for scoring.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe LDZ map\u003C/strong\u003E is built, since none is public: town lists, the ONS place index, and postcode checks.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWeighting\u003C/strong\u003E to gas use and to the heating hours matters; the map method barely does (0.01\u20130.05 \u00b0C).\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMore detail\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe target.\u003C/strong\u003E The model predicts total LDZ demand minus daily-metered demand: homes and small\nbusiness, plus unidentified gas. Not the published non-daily-metered figure \u2014 National Gas\n\u003Cem\u003Eallocates\u003C/em\u003E that using the official CWV, so fitting a weather model to it would be circular. Checking\nthe published totals against the gas metered into each LDZ found a 31 GWh/day feed missing from\nSouth East's total for 18 months (September 2022 \u2013 February 2024); those days are repaired for\ntraining and never used for scoring. \u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003ENational Gas data, Part II\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe LDZ map.\u003C/strong\u003E There is no public map of the LDZs, so one is built: town lists per LDZ, placed with\nthe ONS place index, and \u2014 where a local authority is split between LDZs \u2014 postcodes sampled and\nchecked against the gas networks' own postcode checkers. \u003Ca href=\"/ldz-demand/ldz-geography/\"\u003ELDZ geography\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ELDZ weather.\u003C/strong\u003E Each LDZ's weather is a weighted average of the ERA5 grid cells over it, weighted by\nlocal gas use (DESNZ). The map method barely matters (0.01\u20130.05 \u00b0C day to day); the weighting matters\nmore; the official stations differ most \u2014 by season, by up to 0.85 \u00b0C. The gas day's temperature\nweights the hours when homes heat: 06\u201309 and 16\u201322 count double, the night half.\n\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003ELDZ weather\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EEnsemble LDZ weather.\u003C/strong\u003E The same weights and gas-day rules for every ensemble member and lead day,\nso the forecasts see the same kind of weather the model was fitted on.\n\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003ELDZ ECMWF ensemble\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"cwv-model-the-official-cwvs-structure-refitted-per-ldz-with-three-changes\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003ECWV model |\u003C/span\u003E The official CWV's structure, refitted per LDZ, with three changes\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EKept: an effective temperature with a few days' memory, wind chill, solar, a seasonal shape, a summer\n  cut-off and a cold-weather upturn; demand a straight line in the CWV plus calendar terms.\u003C/li\u003E\n\u003Cli\u003EChanged: \u003Cstrong\u003Ea seasonal shape shared by all LDZs\u003C/strong\u003E, \u003Cstrong\u003Ethe heating-hours temperature\u003C/strong\u003E (\u22129% error), and\n  \u003Cstrong\u003Erecent years weighted more\u003C/strong\u003E (half-life one year).\u003C/li\u003E\n\u003Cli\u003EWhat each part does: \u003Ca href=\"/ldz-demand/model-specification/\"\u003Emodel specification\u003C/a\u003E; every fitted value per LDZ:\n  \u003Ca href=\"/ldz-demand/model-calibration/\"\u003Emodel calibration\u003C/a\u003E.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMore detail\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe official CWV's structure, refitted per LDZ to our weather: an effective temperature with a few\ndays' memory, wind chill, solar, a seasonal shape, a summer cut-off and a cold-weather upturn. Demand\nis then a straight line in the CWV, plus day of week, bank holidays and the Christmas period. Three\nchoices carry most of the improvement:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EA seasonal shape shared by all 13 LDZs\u003C/strong\u003E, in place of the official seasonal profile (which isn't\n  public): one smooth shape through the year, sized per LDZ, so it is estimated from thirteen times\n  the data.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe heating-hours temperature\u003C/strong\u003E: 9% lower error than a flat daily mean, and the gain survives\n  the ensemble's 3- and 6-hourly steps.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ERecent years weighted more\u003C/strong\u003E (half-life one year), so the model follows the fall in demand after\n  the 2022 price shock, and the partial recovery since, without hand-picked break dates.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EWhat each part does is on \u003Ca href=\"/ldz-demand/model-specification/\"\u003Emodel specification\u003C/a\u003E, and how it is fitted, with\nevery value per LDZ, on \u003Ca href=\"/ldz-demand/model-calibration/\"\u003Emodel calibration\u003C/a\u003E; every\nchoice, and the alternatives it beat, in the \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Edecisions\u003C/a\u003E.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"results-9-below-the-official-cwv-29-on-the-coldest-days-beats-national-gas-in-winter\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EResults |\u003C/span\u003E 9% below the official CWV, 29% on the coldest days; beats National Gas in winter\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EEvery score is out of sample: each gas year is predicted only from the years before it.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAgainst the official CWV\u003C/strong\u003E (same regression, same days): GB error 46.2 against 50.8 GWh/day (\u22129%),\n  \u221222% in winter, \u221229% on the coldest days. Better in 10 of the 13 LDZs.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAgainst National Gas's day-ahead forecasts\u003C/strong\u003E: 1.9\u20132.2% error per day against 3.2\u20133.6% in the two\n  winters scored; level over the year; behind in summer and the shoulder months.\u003C/li\u003E\n\u003Cli\u003ENot yet like for like: ours uses actual weather, theirs a forecast. \u003Ca href=\"/ldz-demand/backtesting-results/\"\u003EBacktesting results\u003C/a\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMore detail\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EAgainst the official CWV\u003C/strong\u003E (the same regression, on the same days): GB error 46.2 against\n  50.8 GWh/day over all days (\u22129%), 52.6 against 67.2 in winter (\u221222%), 65.8 against 92.3 on the\n  coldest days (\u221229%). Better in 10 of the 13 LDZs.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EAgainst National Gas's published day-ahead forecasts\u003C/strong\u003E, on total demand: about level over all\n  days (3.2\u20133.3% error per gas day against 3.1\u20133.6%), with 7\u201330% lower RMSE; in the two full winters\n  scored, 1.9\u20132.2% against their 3.2\u20133.6%. They are better in summer \u2014 the shoulder months are this\n  model's weakest.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ENot yet like for like: ours uses actual weather and theirs a day-ahead forecast (a small difference\nat one day ahead), and theirs also forecasts the daily-metered part. \u003Ca href=\"/ldz-demand/backtesting-results/\"\u003EBacktesting results\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"forecasts-two-weeks-ahead-as-a-range-with-the-models-own-error-added\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003EForecasts |\u003C/span\u003E Two weeks ahead as a range, with the model's own error added\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EEach day's ensemble run goes through the model member by member: 50 demand paths per LDZ for 14 days,\n  GB as their sum.\u003C/li\u003E\n\u003Cli\u003EThe intervals add the model's own error to the weather's spread; at short leads the model's error is\n  most of the uncertainty.\u003C/li\u003E\n\u003Cli\u003EEach forecast uses only the data that existed on its run date, and is verified as demand is\n  published. \u003Ca href=\"/ldz-demand/live-forecasts/\"\u003ELive forecasts\u003C/a\u003E\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eMore detail\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEach day's ensemble run goes through the fitted model member by member: 50 demand paths per LDZ for\nthe next 14 days, and GB as their sum. The intervals add the model's own error to the weather's \u2014 the\nspread of the members says how uncertain the weather is, not how far the model can be off when the\nweather is known, and at short leads that is most of the uncertainty. Each forecast is made as it\nwould have been issued, from only the data that existed on its run date, and verified as demand is\npublished. \u003Ca href=\"/ldz-demand/live-forecasts/\"\u003ELive forecasts\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"limitations-five-years-of-data-leave-the-cold-end-and-the-shoulder-months-provisional\"\u003E\u003Cspan style=\"color: var(--muted-foreground); font-weight: 400\"\u003ELimitations |\u003C/span\u003E Five years of data leave the cold end and the shoulder months provisional\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EFive years of demand\u003C/strong\u003E, the portal's rolling window: the 2022 change in behaviour and few cold\n  winters fall inside it, so findings on seasonal behaviour and the cold end are provisional.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe shoulder months\u003C/strong\u003E (spring and October) are the model's weakest; spring 2025 was missed by\n  every model, the official CWV included.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EExtreme cold\u003C/strong\u003E is too rare in five years to calibrate the cold-weather upturn, which sits on its\n  bound in most LDZs.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe forecasts\u003C/strong\u003E need a winter of runs to be scored properly, and to compare with National Gas\n  like for like.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "62d0c257c741feaa66f94ddb328559e2", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eReferences and data sources\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cul\u003E\n\u003Cli\u003ENational Gas, \u003Cem\u003EGas Demand Forecasting Methodology\u003C/em\u003E (2016); data portal, data.nationalgas.com.\u003C/li\u003E\n\u003Cli\u003EXoserve, \u003Cem\u003EComposite Weather Variable\u003C/em\u003E and \u003Cem\u003ESeasonal Normal Composite Weather Variable\u003C/em\u003E (September 2026).\u003C/li\u003E\n\u003Cli\u003ECopernicus Climate Change Service, ERA5 hourly data on single levels (contains modified Copernicus\n  Climate Change Service information).\u003C/li\u003E\n\u003Cli\u003EECMWF open data, ensemble forecasts (CC BY 4.0).\u003C/li\u003E\n\u003Cli\u003EONS, Index of Place Names and local authority boundaries (Open Government Licence; contains OS data\n  \u00a9 Crown copyright and database right). DESNZ, sub-national gas consumption (Open Government\n  Licence). Ordnance Survey, Code-Point Open.\u003C/li\u003E\n\u003Cli\u003ELDZ town lists: energybrokers.co.uk. Postcode checks: SGN and Wales \u0026amp; West Utilities.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThe method in full: the \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/methodology.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Emethodology\u003C/a\u003E; the choices: the \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/decisions.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Edecisions\u003C/a\u003E; the scores:\nthe \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/results.md\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eresults\u003C/a\u003E.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "4da560a287931556435a4220e180a7a0", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cdiv id=\"definitions\" style=\"margin-top: 2.5em; color: var(--muted-foreground); font-size: 0.9em; line-height: 1.7\"\u003E\u003Cdiv style=\"font-weight: 600; color: var(--foreground)\"\u003E\u003Ci\u003EDefinitions\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003E\u003Ci\u003EQ\u003C/i\u003E\u003C/span\u003E \u2014 gas demand: LDZ total minus daily-metered, GWh per gas day\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003EP\u003Csub\u003E10\u003C/sub\u003E\u2013P\u003Csub\u003E90\u003C/sub\u003E\u003C/span\u003E \u2014 the forecast range \u003Ci\u003EQ\u003C/i\u003E falls in 8 times in 10; P\u003Csub\u003E50\u003C/sub\u003E is the median\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\"color: var(--foreground)\"\u003E\u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003ED+1\u003C/sub\u003E, \u003Ci\u003EQ\u003C/i\u003E\u003Csub\u003ED+6\u003C/sub\u003E\u003C/span\u003E \u2014 National Gas's provisional (next day) and closed-out (six days on) figures\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"border-top: 1px solid var(--border); margin-top: 2.5em; padding-top: 0.8em; color: var(--muted-foreground); font-size: 0.85em; display: flex; flex-wrap: wrap; gap: 0.3em 1.5em; justify-content: space-between\"\u003E\u003Cspan\u003E\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand\"\u003ECode on GitHub\u003C/a\u003E \u00b7 \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/LICENSE\"\u003EMIT licence\u003C/a\u003E \u00b7 \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/CITATION.cff\"\u003ECite this\u003C/a\u003E \u00b7 \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand/blob/main/docs/methodology.md\"\u003EMethodology\u003C/a\u003E \u00b7 \u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#data-sources-and-licences\"\u003EData sources and licences\u003C/a\u003E\u003C/span\u003E\u003Cspan\u003EBuilt 14 Nov 2026 \u00b7 version 0.1.0\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.2", "script_metadata_hash": null}, "version": "1"},
            "runtimeConfig": null
        }),
        writable: false,

      });
