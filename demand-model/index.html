      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "ed9a8080fb19f4f8e8c6e29f96b1edc5", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6684dab67c295aaa98af14ddfbed30bc", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"/ldz-demand/\"\u003E\u2190 Overview\u003C/a\u003E\u003C/span\u003E\n\u003Cdiv style=\"display: grid; grid-template-columns: max-content max-content; width: fit-content; background: var(--muted); border-radius: 8px; padding: 0.5em 1.4em 0.5em 1.1em\"\u003E\u003Cspan style=\"color: var(--muted-foreground); padding: 0.4em 2em 0.4em 0\"\u003EProject\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/project-map/\"\u003EProject map\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--muted-foreground); padding: 0.4em 2em 0.4em 0\"\u003EData\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ng-ldz-daily/\"\u003ENational Gas data\u003C/a\u003E\u003Ca href=\"/ldz-demand/era5-weather/\"\u003EERA5 weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--muted-foreground); padding: 0.4em 2em 0.4em 0\"\u003EPre-CWV models\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003ELDZ geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003ELDZ weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003EEnsemble LDZ weather\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--muted-foreground); padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003EDemand model\u003C/strong\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--muted-foreground); padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/results/\"\u003EResults\u003C/a\u003E\u003Ca href=\"/ldz-demand/demand-forecasts/\"\u003EDemand forecasts\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\n\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA static snapshot, with data to 20 October 2026: the charts respond to hover and zoom, but the controls are fixed. Run the dashboard locally for the live version (\u003Ca href=\"https://github.com/rwbh-lab/ldz-demand#quick-start\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EREADME\u003C/a\u003E).\u003C/em\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ca1d99fa815663a95ebb150ed926dbac", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"demand-model\"\u003EDemand model\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EHow the model turns a day's weather into gas demand, one part at a time.\u003C/em\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe model has two stages. First, a day's weather becomes one number \u2014 the \u003Cstrong\u003EComposite Weather\nVariable (CWV)\u003C/strong\u003E, roughly \"how cold the day feels to gas demand\", in \u00b0C. Then demand is a straight line\nin the CWV, plus calendar effects. The CWV is built in the same steps as the official one; every\nparameter is refitted to our weather, per LDZ.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{aligned}\nE_t \u0026amp;= y \\cdot E_{t-1} + (1-y)\\,T_t \u0026amp;\u0026amp; \\text{\u00a72}\\\\\nCW_t \u0026amp;= E_t - I_2 \\max(0, W_t - W_0)\\max(0, T_0 - T_t) + S_0\\,SR_t + S_c\\,g(\\text{day}) \u0026amp;\u0026amp; \\text{\u00a73\u20135}\\\\\nCWV_t \u0026amp;= f(CW_t;\\ V_0, I_3, V_1, V_2, q) \u0026amp;\u0026amp; \\text{\u00a76}\\\\\n\\text{demand}_t \u0026amp;= a + b\\,CWV_t + \\text{calendar}_t \u0026amp;\u0026amp; \\text{\u00a77\u20138}\n\\end{aligned}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003ET\u003C/em\u003E is the gas day's temperature (\u00a71), \u003Cem\u003EW\u003C/em\u003E the wind speed, \u003Cem\u003ESR\u003C/em\u003E solar radiation \u2014 all ERA5, averaged\nover the LDZ and weighted by where gas is used. The calendar is day of week, bank holidays and\nChristmas; recent years count more in the fit (\u00a78). This page shows what each part does, with the\n\u003Cstrong\u003Efinal fit\u003C/strong\u003E (\u003Ccode\u003Eldz_demand.models.fit\u003C/code\u003E; \u003Ccode\u003Edocs/decisions.md\u003C/code\u003E C1 \u2013 C9). How well the model scores, and\nwhy each part was chosen over the alternatives, is in \u003Ccode\u003Edocs/results.md\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "735fd3f406d46b300933ea5711dfbe27", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='bkHC-0' random-id='3645c53d-21db-65de-120b-c816d3e97753'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;NT\u0026quot;]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eLDZ\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-options='[\u0026quot;EA\u0026quot;,\u0026quot;EM\u0026quot;,\u0026quot;NE\u0026quot;,\u0026quot;NO\u0026quot;,\u0026quot;NT\u0026quot;,\u0026quot;NW\u0026quot;,\u0026quot;SC\u0026quot;,\u0026quot;SE\u0026quot;,\u0026quot;SO\u0026quot;,\u0026quot;SW\u0026quot;,\u0026quot;WM\u0026quot;,\u0026quot;WN\u0026quot;,\u0026quot;WS\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false' data-disabled='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "d0ac3e390a59fb3f027608dc23d22ed3", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f780aad3d5e2853289423f4eddceb9fc", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-the-gas-days-temperature\"\u003E1 \u00b7 The gas day's temperature\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA gas day runs 05:00 to 05:00. Rather than a flat average of its hours, the model weights the\nhours when homes heat: \u003Cstrong\u003E06\u201309 and 16\u201322 count double, 23\u201305 half\u003C/strong\u003E. Night-time temperature\nmatters less to demand than the temperature while people are up. It is the largest single\nimprovement after the seasonal term (\u22129% error), and it survives the ensemble forecasts' 3- and\n6-hourly steps (\u003Ccode\u003Edecisions.md\u003C/code\u003E P5).\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-plotly data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;hovertemplate\u0026quot;:\u0026quot;%{x}: weight %{y:.1f}\u0026#92;u003cextra\u0026#92;u003e\u0026#92;u003c/extra\u0026#92;u003e\u0026quot;,\u0026quot;marker\u0026quot;:{\u0026quot;color\u0026quot;:\u0026quot;#3987e5\u0026quot;},\u0026quot;x\u0026quot;:[\u0026quot;05:00\u0026quot;,\u0026quot;06:00\u0026quot;,\u0026quot;07:00\u0026quot;,\u0026quot;08:00\u0026quot;,\u0026quot;09:00\u0026quot;,\u0026quot;10:00\u0026quot;,\u0026quot;11:00\u0026quot;,\u0026quot;12:00\u0026quot;,\u0026quot;13:00\u0026quot;,\u0026quot;14:00\u0026quot;,\u0026quot;15:00\u0026quot;,\u0026quot;16:00\u0026quot;,\u0026quot;17:00\u0026quot;,\u0026quot;18:00\u0026quot;,\u0026quot;19:00\u0026quot;,\u0026quot;20:00\u0026quot;,\u0026quot;21:00\u0026quot;,\u0026quot;22:00\u0026quot;,\u0026quot;23:00\u0026quot;,\u0026quot;00:00\u0026quot;,\u0026quot;01:00\u0026quot;,\u0026quot;02:00\u0026quot;,\u0026quot;03:00\u0026quot;,\u0026quot;04:00\u0026quot;],\u0026quot;y\u0026quot;:{\u0026quot;dtype\u0026quot;:\u0026quot;f8\u0026quot;,\u0026quot;bdata\u0026quot;:\u0026quot;AAAAAAAA8D8AAAAAAAAAQAAAAAAAAABAAAAAAAAAAEAAAAAAAADwPwAAAAAAAPA/AAAAAAAA8D8AAAAAAADwPwAAAAAAAPA/AAAAAAAA8D8AAAAAAADwPwAAAAAAAABAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAABAAAAAAAAAAEAAAAAAAAAAQAAAAAAAAPA/AAAAAAAA4D8AAAAAAADgPwAAAAAAAOA/AAAAAAAA4D8AAAAAAADgPwAAAAAAAOA/\u0026quot;},\u0026quot;type\u0026quot;:\u0026quot;bar\u0026quot;}],\u0026quot;layout\u0026quot;:{\u0026quot;template\u0026quot;:{\u0026quot;data\u0026quot;:{\u0026quot;scattergl\u0026quot;:[{\u0026quot;line\u0026quot;:{\u0026quot;width\u0026quot;:2},\u0026quot;marker\u0026quot;:{\u0026quot;size\u0026quot;:8},\u0026quot;type\u0026quot;:\u0026quot;scattergl\u0026quot;}],\u0026quot;scatter\u0026quot;:[{\u0026quot;line\u0026quot;:{\u0026quot;width\u0026quot;:2},\u0026quot;marker\u0026quot;:{\u0026quot;size\u0026quot;:8},\u0026quot;type\u0026quot;:\u0026quot;scatter\u0026quot;}]},\u0026quot;layout\u0026quot;:{\u0026quot;colorscale\u0026quot;:{\u0026quot;sequential\u0026quot;:[[0.0,\u0026quot;#104281\u0026quot;],[0.2,\u0026quot;#1c5cab\u0026quot;],[0.4,\u0026quot;#2a78d6\u0026quot;],[0.6,\u0026quot;#5598e7\u0026quot;],[0.8,\u0026quot;#86b6ef\u0026quot;],[1.0,\u0026quot;#b7d3f6\u0026quot;]]},\u0026quot;colorway\u0026quot;:[\u0026quot;#3987e5\u0026quot;,\u0026quot;#d95926\u0026quot;,\u0026quot;#199e70\u0026quot;,\u0026quot;#c98500\u0026quot;,\u0026quot;#d55181\u0026quot;,\u0026quot;#008300\u0026quot;,\u0026quot;#9085e9\u0026quot;,\u0026quot;#e66767\u0026quot;],\u0026quot;font\u0026quot;:{\u0026quot;color\u0026quot;:\u0026quot;#c2c0b6\u0026quot
