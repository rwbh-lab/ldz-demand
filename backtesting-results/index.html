    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

adding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/ldz-geography/\"\u003ELDZ geography\u003C/a\u003E\u003Ca href=\"/ldz-demand/ldz-weather/\"\u003ELDZ weather\u003C/a\u003E\u003Ca href=\"/ldz-demand/ensemble-forecasts/\"\u003ELDZ Ens forecast\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003ECWV model\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Ca href=\"/ldz-demand/model-specification/\"\u003EModel specification\u003C/a\u003E\u003Ca href=\"/ldz-demand/model-calibration/\"\u003EModel calibration\u003C/a\u003E\u003C/span\u003E\u003Cspan style=\"color: var(--foreground); font-weight: 600; padding: 0.4em 2em 0.4em 0\"\u003EOutputs\u003C/span\u003E\u003Cspan style=\"display: flex; flex-direction: column; padding: 0.4em 0\"\u003E\u003Cstrong style=\"border-left: 2px solid #d97757; padding-left: 0.45em; margin-left: calc(-0.45em - 2px)\"\u003EBacktesting results\u003C/strong\u003E\u003Ca href=\"/ldz-demand/live-forecasts/\"\u003ELive forecasts\u003C/a\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style=\"flex: 1 1 22em; min-width: 0\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEvery score here is \u003Cstrong\u003Eout of sample\u003C/strong\u003E: each gas year from 2023/24 is predicted by a model fitted only on\nthe years before it \u2014 as a forecaster would have had to. Scores are for \u003Cstrong\u003EGB\u003C/strong\u003E, the sum of the 13\nLDZs, on days every LDZ has, with actual weather (ERA5). How the model works is on the\n\u003Ca href=\"/ldz-demand/model-specification/\"\u003EModel specification\u003C/a\u003E page; the reasoning behind each choice is in \u003Ccode\u003Edocs/decisions.md\u003C/code\u003E, and\nthe full write-up in \u003Ccode\u003Edocs/results.md\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u
